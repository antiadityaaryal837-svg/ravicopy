<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aditya Aryal | Professional YouTube Thumbnail Designer</title>

    <!-- SEO & Metadata -->
    <meta name="description" content="Portfolio of Aditya Aryal, professional YouTube thumbnail designer with 13+ years of graphic experience. Boost your CTR with high-conversion thumbnails." />
    <meta name="keywords" content="YouTube thumbnail designer, thumbnail design, CTR optimization, Aditya Aryal, freelance designer, professional thumbnails, click-through rate, video clickability" />
    <meta name="author" content="Aditya Aryal" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://adityaaryal.com.np" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adityaaryal.com.np" />
    <meta property="og:title" content="Aditya Aryal | Professional YouTube Thumbnail Designer" />
    <meta property="og:description" content="Boost your CTR with customized YouTube thumbnail designs. Portfolio of Aditya Aryal, trusted by top creators with 14,200+ five-star reviews." />
    <meta property="og:image" content="https://adityaaryal.com.np/og-image.jpg" />
    <meta property="og:site_name" content="Aditya Aryal" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://adityaaryal.com.np" />
    <meta name="twitter:title" content="Aditya Aryal | Professional YouTube Thumbnail Designer" />
    <meta name="twitter:description" content="Boost your CTR with customized YouTube thumbnail designs. Portfolio of Aditya Aryal, trusted by top creators with 14,200+ five-star reviews." />
    <meta name="twitter:image" content="https://adityaaryal.com.np/og-image.jpg" />

    <!-- PWA & Mobile Optimization -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#d4ff00" />

    <!-- Preconnect to font origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!--
      Load Google Fonts non-render-blocking:
      media="print" trick → onload switches it to "all" after CSS downloads.
      The <noscript> fallback covers no-JS environments.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap">
    </noscript>

    <!-- Preload the LCP image (profile icon shown above the fold in Hero) -->
    <link rel="preload" as="image" href="/myicon.webp" fetchpriority="high" />
  </head>
  <body class="bg-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
